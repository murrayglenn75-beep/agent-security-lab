name: Provider Boundary Contract Tests
on:
  pull_request:
  push:
    branches: [feature/provider-neutral-inference-boundary-20261013]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s experimental/provider_boundary -p 'test_*.py' -v
